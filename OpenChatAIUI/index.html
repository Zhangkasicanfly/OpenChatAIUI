    const labels = ['关闭', '低', '中', '高', '2×'];
    $('#thinkVal').textContent = labels[lvl];
    this.style.setProperty('--pct', (lvl / 4 * 100) + '%');
    $$('#thinkLabels span').forEach(function (s, i) {
      s.classList.toggle('active', i === lvl);
    });
    save();
  });

  // 主题切换
  $('#themeBtn').addEventListener('click', function () {
    const cur = effectiveTheme();
    state.settings.theme = cur === 'dark' ? 'light' : 'dark';
    save();
    applyTheme();
  });

  // 清空当前对话
  $('#clearBtn').addEventListener('click', function () {
    const conv = currentConv();
    if (!conv || !conv.messages.length) return;
    if (!confirm('确定清空当前对话的所有消息吗？')) return;
    conv.messages = [];
    conv.title = '新对话';
    editingId = null;
    save();
    renderAll();
  });

  // 侧边栏
  function openSidebar() {
    $('#sidebar').classList.add('open');
    $('#mask').classList.add('show');
  }
  function closeSidebar() {
    $('#sidebar').classList.remove('open');
    $('#mask').classList.remove('show');
  }
  function toggleCollapse() {
    const app = $('#app');
    app.classList.toggle('collapsed');
    $('#expandBtn').hidden = !app.classList.contains('collapsed');
  }

  $('#menuBtn').addEventListener('click', openSidebar);
  $('#mask').addEventListener('click', closeSidebar);
  $('#collapseBtn').addEventListener('click', toggleCollapse);
  $('#expandBtn').addEventListener('click', toggleCollapse);

  // 导出
  $('#exportBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    const menu = $('#exportMenu');
    if (menu.classList.contains('open')) { menu.classList.remove('open'); return; }
    const r = e.currentTarget.getBoundingClientRect();
    menu.style.left = Math.min(r.left, window.innerWidth - 200) + 'px';
    menu.style.bottom = (window.innerHeight - r.top + 8) + 'px';
    menu.classList.add('open');
  });

  $('#exportMenu').addEventListener('click', function (e) {
    const btn = e.target.closest('[data-export]');
    if (!btn) return;
    $('#exportMenu').classList.remove('open');

    const conv = currentConv();
    if (!conv || !conv.messages.length) {
      alert('当前没有可导出的对话');
      return;
    }

    const safeTitle = (conv.title || '对话').replace(/[\\/:*?"<>|]/g, '_').slice(0, 40);

    if (btn.getAttribute('data-export') === 'json') {
      downloadFile(safeTitle + '.json', JSON.stringify(conv, null, 2), 'application/json');
      return;
    }

    let mdText = '# ' + (conv.title || '对话') + '\n\n';
    conv.messages.forEach(function (m) {
      mdText += '## ' + (m.role === 'user' ? '用户' : '助手') + '\n\n';
      if (m.reasoning) {
        mdText += '> 思考过程\n>\n';
        m.reasoning.split('\n').forEach(function (l) { mdText += '> ' + l + '\n'; });
        mdText += '\n';
      }
      mdText += (m.content || '') + '\n\n';
    });
    downloadFile(safeTitle + '.md', mdText, 'text/markdown;charset=utf-8');
  });

  // 项目文件
  if (CONFIG.features.filePreview) {
    $('#filesBtn').hidden = false;
    $('#filesBtn').addEventListener('click', openFiles);
    $('#closeFiles').addEventListener('click', closeFiles);
    $('#filesMask').addEventListener('click', function (e) {
      if (e.target === $('#filesMask')) closeFiles();
    });
    $('#filesList').addEventListener('click', function (e) {
      const item = e.target.closest('[data-file]');
      if (!item) return;
      currentFile = parseInt(item.getAttribute('data-file'), 10);
      renderFilesList();
      renderFilePreview();
    });
    $('#downloadFileBtn').addEventListener('click', function () {
      const f = PROJECT_FILES[currentFile];
      downloadFile(f.downloadName, f.getContent(), f.mime + ';charset=utf-8');
    });
  } else {
    $('#filesBtn').hidden = true;
  }

  // 设置弹窗
  const modal = $('#settingsMask');

  function openSettings() {
    const s = state.settings;
    $('#setBase').value = s.apiBase || '';
    $('#setKey').value = s.apiKey || '';
    $('#setName').value = s.userName || '';
    $('#setSystem').value = s.systemPrompt || '';
    $('#setTemp').value = typeof s.temperature === 'number' ? s.temperature : 0.7;
    $('#setTempVal').textContent = (typeof s.temperature === 'number' ? s.temperature : 0.7).toFixed(1);
    $('#setMaxTokens').value = s.maxTokens || '';
    $('#setMaxChars').value = s.maxChars || CONFIG.defaultMaxChars;
    $('#setDemo').setAttribute('aria-checked', s.demo ? 'true' : 'false');
    applyTheme();
    // 切回通用 tab
    switchTab('general');
    modal.classList.add('open');
  }
  function closeSettings() { modal.classList.remove('open'); }

  function switchTab(name) {
    $$('#settingsTabs .tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === name);
    });
    $$('.tab-panel').forEach(function (p) {
      p.hidden = p.getAttribute('data-panel') !== name;
    });
  }

  $('#settingsTabs').addEventListener('click', function (e) {
    const tab = e.target.closest('.tab');
    if (tab) switchTab(tab.getAttribute('data-tab'));
  });

  $('#setTemp').addEventListener('input', function (e) {
    $('#setTempVal').textContent = parseFloat(e.target.value).toFixed(1);
  });

  $('#toggleKey').addEventListener('click', function () {
    const input = $('#setKey');
    if (input.type === 'password') {
      input.type = 'text';
      this.textContent = '隐藏';
    } else {
      input.type = 'password';
      this.textContent = '显示';
    }
  });

  $('#setDemo').addEventListener('click', function () {
    const cur = this.getAttribute('aria-checked') === 'true';
    this.setAttribute('aria-checked', cur ? 'false' : 'true');
  });

  $('#themePicker').addEventListener('click', function (e) {
    const opt = e.target.closest('.theme-opt');
    if (!opt) return;
    state.settings.theme = opt.getAttribute('data-theme');
    save();
    applyTheme();
  });

  $('#settingsBtn').addEventListener('click', openSettings);
  $('#hintSettings').addEventListener('click', function (e) { e.preventDefault(); openSettings(); });
  $('#closeSettings').addEventListener('click', closeSettings);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeSettings(); });

  $('#saveSettings').addEventListener('click', function () {
    state.settings.apiBase = $('#setBase').value.trim() || CONFIG.defaultApiBase;
    state.settings.apiKey = $('#setKey').value.trim();
    state.settings.userName = $('#setName').value.trim() || '游客';
    state.settings.systemPrompt = $('#setSystem').value;
    state.settings.temperature = parseFloat($('#setTemp').value) || 0;
    state.settings.maxTokens = $('#setMaxTokens').value.trim();
    const mc = parseInt($('#setMaxChars').value, 10);
    state.settings.maxChars = mc > 0 ? mc : CONFIG.defaultMaxChars;
    state.settings.demo = $('#setDemo').getAttribute('aria-checked') === 'true';
    save();
    renderAll();
    closeSettings();
  });

  $('#resetAll').addEventListener('click', function () {
    if (!confirm('将清空所有对话与设置，确定吗？')) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeSettings();
      closeFiles();
      $('#modelMenu').classList.remove('open');
      $('#modelBtn').classList.remove('open');
      $('#exportMenu').classList.remove('open');
      closeSidebar();
      if (editingId) { editingId = null; renderMessages(); }
    }
    // 快捷新建对话
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      newConversation();
      inputEl.focus();
    }
  });

  /* ═══════════════════════════════════════════════════════════════════════
     §12 启动
     ═══════════════════════════════════════════════════════════════════════ */
  function init() {
    // 静态图标注入
    $('#brandLogo').innerHTML = icon('bot', 18);
    $('#collapseBtn').innerHTML = icon('panel', 17);
    $('#expandBtn').innerHTML = icon('panel', 17);
    $('#menuBtn').innerHTML = icon('menu', 19);
    $('#searchIcon').innerHTML = icon('search', 15);
    $('#clearBtn').innerHTML = icon('trash', 17);
    $('#closeSettings').innerHTML = icon('x', 17);
    $('#closeFiles').innerHTML = icon('x', 17);
    $('#sendBtn').innerHTML = icon('send', 18);
    $('#newChatIcon').innerHTML = icon('plus', 15);
    $('#newChatKbd').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl+K';
    $('#thinkIcon').innerHTML = icon('brain', 14);
    $('#downloadIcon').innerHTML = icon('download', 13);

    $('#filesBtn').innerHTML = icon('code', 16) + '<span>项目文件</span>';
    $('#exportBtn').innerHTML = icon('download', 16) + '<span>导出对话</span>';
    $('#settingsBtn').innerHTML = icon('settings', 16) + '<span>设置</span>';

    const f = $('#exportMenu [data-ico="file"]');
    if (f) f.outerHTML = icon('file', 15);
    const b = $('#exportMenu [data-ico="braces"]');
    if (b) b.outerHTML = icon('braces', 15);

    // 主题选择器图标
    const tp = $('#themePicker');
    if (tp) {
      const themes = { dark: 'moon', light: 'sun', system: 'monitor' };
      $$('.theme-opt', tp).forEach(function (opt) {
        const t = opt.getAttribute('data-theme');
        const s = opt.querySelector('[data-ico]');
        if (s) s.outerHTML = icon(themes[t], 20);
      });
    }

    // 关于页 logo
    const al = $('#aboutLogo');
    if (al) al.innerHTML = icon('bot', 26);

    document.title = CONFIG.appName + ' · 开源 AI 对话界面模板';
    $('#brandName').textContent = CONFIG.appName;

    // 数据兼容处理
    state.conversations.forEach(function (c) {
      if (!c.messages) c.messages = [];
      c.messages.forEach(function (m) {
        if (!m.id) m.id = 'm' + Date.now() + uid().slice(0, 4);
        m.streaming = false;
        if (m.reasoningOpen === undefined) m.reasoningOpen = false;
      });
    });

    if (!state.conversations.some(function (c) { return c.id === state.currentId; })) {
      state.currentId = state.conversations[0] ? state.conversations[0].id : null;
    }

    applyTheme();
    renderAll();
    setBusyUI(false);
    resizeInput();
    updateCharCount();
    inputEl.focus();
    save();
  }

  init();
})();
</script>
</body>
</html>
